name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # audit F-13: gate dependency. PostCSS (build-time, transitif dari Next)
      # masih dilaporkan high; kegagalan di sini adalah sinyal upgrade, bukan
      # regresi kode aplikasi.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=critical

      - run: pnpm run lint

      - run: pnpm run test

      - run: pnpm run build
